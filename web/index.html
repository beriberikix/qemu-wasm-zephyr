<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zephyr RTOS - QEMU WebAssembly</title>
  <link rel="stylesheet" crossorigin="anonymous"
        href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 16px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 {
      font-size: 1rem;
      font-weight: 600;
      color: #e94560;
    }
    header .status {
      font-size: 0.8rem;
      color: #888;
    }
    header .status.ready { color: #4ecca3; }
    #terminal-container {
      flex: 1;
      padding: 4px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <header>
    <h1>Zephyr RTOS on QEMU x86</h1>
    <span id="status" class="status">Initializing...</span>
  </header>
  <div id="terminal-container"></div>

  <script crossorigin="anonymous"
          src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script crossorigin="anonymous"
          src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
