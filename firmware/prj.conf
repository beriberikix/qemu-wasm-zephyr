# Serial and console
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Zephyr shell subsystem
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_CMDS=y
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y

# Boot configuration for QEMU x86
CONFIG_MULTIBOOT=y
CONFIG_KERNEL_BIN_NAME="zephyr"

# Keep build lean

CONFIG_OUTPUT_PRINT_MEMORY_USAGE=n

# Networking: e1000 NIC (QEMU -device e1000), IPv4, DHCP, DNS.
# The browser carries the NIC's frames to relaynet, which answers DHCP
# and DNS and NATs to the internet.
CONFIG_NETWORKING=y
CONFIG_PCIE=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_QEMU_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_ICMPV4_ACCEPT_BROADCAST=n
CONFIG_NET_DHCPV4=y
# Start DHCP within 2 s of boot (the minimum), not up to 10 s (guest time runs slow
# under the TCG interpreter).
CONFIG_NET_DHCPV4_INITIAL_DELAY_MAX=2
CONFIG_DNS_RESOLVER=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_SHELL=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_NET_LOG=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_NET_DHCPV4_LOG_LEVEL_INF=y
