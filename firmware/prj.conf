# Serial and console
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Zephyr shell subsystem
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_CMDS=y
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y

# Boot configuration for QEMU x86
CONFIG_MULTIBOOT=y
CONFIG_KERNEL_BIN_NAME="zephyr"

# Keep build lean
CONFIG_LOG=n
CONFIG_OUTPUT_PRINT_MEMORY_USAGE=n
